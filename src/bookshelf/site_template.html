<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bookshelf</title>
<!-- Generated by `books site` from src/bookshelf/site_template.html. Edit the template, not data/site/. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Instrument+Serif:ital@0;1&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0b1210;          /* bottle-green ink: the walls of a reading room */
  --bg-rgb: 11, 18, 16;
  --fg: #efe7d4;          /* parchment */
  --dim: #8d8b79;
  --faint: #34403a;
  --line: #1c2722;
  --brass: #c9a35b;       /* read */
  --ribbon: #c8452f;      /* currently reading: a silk bookmark */
  --lamp: 255, 190, 115;
  --paper: #ece6d6;
  --paper-ink: #24211c;
  --serif: "Instrument Serif", "Times New Roman", serif;
  --text: "Newsreader", Georgia, serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  --ease: cubic-bezier(.2, .8, .2, 1);
  --shelf-h: 460px;
  --gap: 6px;
  --noise: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5 0 0 0 0 .5 0 0 0 0 .5 0 0 0 .55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  color: var(--fg); font-family: var(--text); overflow: hidden; -webkit-font-smoothing: antialiased;
  background-color: var(--bg);
  background-image:
    radial-gradient(120% 80% at 50% 120%, rgba(0,0,0,.65), transparent 60%),   /* floor in shadow */
    radial-gradient(90% 70% at 50% -10%, rgba(var(--lamp), .05), transparent 70%), /* ceiling light */
    repeating-linear-gradient(90deg, transparent 0 219px, rgba(255,255,255,.018) 219px 220px, rgba(0,0,0,.16) 220px 223px); /* panelling */
}
body::after { /* paper grain over everything */
  content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 60;
  background-image: var(--noise); opacity: .07; mix-blend-mode: overlay;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
.mono { font-family: var(--mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; }
.btn { font-family: var(--mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--fg); opacity: .85; white-space: nowrap; }
.btn:hover, .btn:focus-visible { opacity: 1; text-decoration: underline; text-underline-offset: 3px; }
:focus-visible { outline: 1px solid var(--fg); outline-offset: 3px; }

/* ------------------------------------------------------------------ top bar */
.bar {
  position: fixed; inset: 0 0 auto 0; z-index: 20; height: 44px;
  display: flex; align-items: center; gap: 20px; padding: 0 16px;
  border-bottom: 1px solid var(--line); background: rgba(var(--bg-rgb), .82); backdrop-filter: blur(8px);
}
.bar .brand { font-family: var(--mono); font-weight: 600; font-size: 13px; letter-spacing: .12em; }
.bar .spacer { flex: 1; }
.bar .count { color: var(--dim); }
.bar .count b { font-weight: 400; color: var(--brass); }
.bar .count i { font-style: normal; color: var(--ribbon); }

/* ------------------------------------------------------------------ shelf page */
#shelfPage {
  position: fixed; inset: 44px 0 0 0; display: flex; flex-direction: column;
  transition: opacity .3s var(--ease), filter .3s var(--ease);
}
body.reading #shelfPage { opacity: 0; filter: blur(4px); pointer-events: none; }

.titles-wrap { position: relative; overflow: hidden; padding: 22px 0 10px; flex: none; mask-image: linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent); }
.titles { display: flex; gap: 44px; white-space: nowrap; will-change: transform; transition: transform .45s var(--ease); width: max-content; }
.tt { font-family: var(--serif); font-style: italic; font-size: clamp(30px, 4.6vw, 64px); line-height: 1; color: var(--faint); transition: color .4s; }
.tt sup { font-family: var(--mono); font-style: normal; font-size: 10px; letter-spacing: .04em; vertical-align: top; margin-left: 4px; color: var(--faint); text-transform: uppercase; }
.tt.on { font-style: normal; color: var(--fg); }
.tt.on sup { color: var(--dim); }
.tt:hover { color: var(--dim); }
.tt.st-read { color: rgba(201, 163, 91, .42); }
.tt.st-read.on { color: var(--brass); }
.tt.st-reading { color: rgba(200, 69, 47, .5); }
.tt.st-reading.on { color: var(--fg); }
.tt.st-read sup, .tt.st-read.on sup { color: var(--brass); }
.tt.st-reading sup, .tt.st-reading.on sup { color: var(--ribbon); }

.shelf {
  overscroll-behavior: contain;
  flex: 1; min-height: 0; display: flex; align-items: center;
  overflow-x: auto; overflow-y: hidden; scrollbar-width: none; cursor: grab;
  padding: 0 8vw; user-select: none;
}
.shelf::-webkit-scrollbar { display: none; }
.lamp { /* a pool of warm light that follows the book you're looking at */
  position: absolute; top: -10%; bottom: 0; width: 900px; left: calc(50vw - 450px); /* moved from JS (frame) */
  background: radial-gradient(closest-side at 50% 52%, rgba(var(--lamp), .16), rgba(var(--lamp), .05) 55%, transparent);
  transition: left .5s var(--ease); pointer-events: none; z-index: 0; mix-blend-mode: screen;
}
.shelf { position: relative; z-index: 1; }
.shelf.dragging { cursor: grabbing; }
.row { display: flex; align-items: flex-end; height: calc(var(--shelf-h) + 40px); padding-bottom: 28px; position: relative; }
.row::after { /* walnut ledge */
  content: ""; position: absolute; left: -8vw; right: -8vw; bottom: 6px; height: 22px; z-index: -2;
  background:
    linear-gradient(180deg, rgba(255,214,160,.28) 0 1px, transparent 1px 5px, rgba(0,0,0,.35)),
    repeating-linear-gradient(92deg, rgba(0,0,0,.12) 0 2px, transparent 2px 9px, rgba(255,255,255,.03) 9px 10px, transparent 10px 23px),
    linear-gradient(180deg, #4a3020, #2a1a10);
  box-shadow: 0 18px 30px rgba(0,0,0,.7), 0 2px 0 rgba(0,0,0,.6);
}

.slot {
  --t: 40px; --w: 280px; --h: 420px;
  flex: none; position: relative; height: var(--h);
  width: calc(var(--t) + var(--gap));
  perspective: 2200px; perspective-origin: calc(50% + var(--px, 0px)) 12%;
  transition: width .42s var(--ease);
}
.row.still .slot, .row.still .box { transition: none !important; }
.slot.active { width: calc(var(--w) + var(--gap) * 4 + 18px); }
.slot::after { /* contact shadow on the floor */
  content: ""; position: absolute; left: 50%; bottom: -14px; height: 22px;
  width: calc(var(--t) * 1.5); transform: translateX(-50%);
  background: radial-gradient(closest-side, rgba(0,0,0,.9), transparent);
  transition: width .42s var(--ease); pointer-events: none; z-index: -1;
}
.slot.active::after { width: calc(var(--w) * 1.05); }

.book { position: absolute; inset: 0; transform-style: preserve-3d; }
.box {
  position: absolute; left: 50%; bottom: 0; width: var(--t); height: var(--h);
  margin-left: calc(var(--t) / -2); transform-style: preserve-3d;
  transform: translateZ(calc(var(--w) / -2)) translateY(0) rotateY(0deg);
  transition: transform .42s var(--ease);
}
.slot:not(.active) .book:hover .box { transform: translateZ(calc(var(--w) / -2)) translateY(-10px) rotateY(0deg); }
.slot.active .box { transform: translateZ(calc(var(--t) / -2 + 34px)) translateY(-6px) rotateY(-90deg); }
.slot.flying .box { visibility: hidden; }
.ribbon { /* bookmark poking out of the top while you're reading it */
  display: none; position: absolute; left: 50%; top: 50%; width: max(9px, calc(var(--t) * .26)); height: 84px;
  margin: calc(var(--h) / -2 - 26px) 0 0 calc(var(--t) * .1);
  transform: translateZ(calc(var(--w) / 2 + 1px));
  background: linear-gradient(90deg, #8f2818, var(--ribbon) 35%, #e46a4f 55%, #a8331f);
  clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 88%, 0 100%); /* forked tail hanging down the spine */
  box-shadow: 0 0 0 1px rgba(0,0,0,.2);
}
.slot.reading .ribbon { display: block; }
.slot.read .sp-mark { background: var(--brass); border-color: var(--brass); color: #20180b; }

.face { position: absolute; left: 50%; top: 50%; backface-visibility: hidden; }
.spine {
  width: var(--t); height: var(--h); margin: calc(var(--h) / -2) 0 0 calc(var(--t) / -2);
  transform: translateZ(calc(var(--w) / 2));
  background-color: var(--base); color: var(--ink);
  display: flex; flex-direction: column; align-items: center; padding: 14px 0 12px; gap: 12px; overflow: hidden;
}
.spine::before, .front::before, .back::before { /* cloth texture */
  content: ""; position: absolute; inset: 0; background-image: var(--noise); mix-blend-mode: overlay; opacity: .5; pointer-events: none;
}
.spine::after { /* the curve of a hardcover spine */
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(90deg, rgba(0,0,0,.42), rgba(255,255,255,.10) 18%, rgba(255,255,255,.04) 45%, rgba(0,0,0,.12) 78%, rgba(0,0,0,.45));
}
.sp-author, .sp-title { writing-mode: vertical-rl; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; position: relative; z-index: 1; }
.sp-author { font-family: var(--mono); font-size: min(9.5px, calc(var(--t) * .28)); letter-spacing: .08em; text-transform: uppercase; opacity: .8; max-height: 26%; flex: none; }
.sp-title { font-family: var(--serif); font-size: min(26px, calc(var(--t) * .52)); line-height: 1; flex: 1; min-height: 0; }
.v1 .sp-title { font-style: italic; }
.v2 .sp-title { font-family: var(--mono); font-size: min(14px, calc(var(--t) * .32)); letter-spacing: .1em; text-transform: uppercase; font-weight: 600; }
.v2 .spine { padding-top: 0; }
.v2 .sp-band { display: block; }
.sp-band { display: none; width: 100%; height: 13%; flex: none; background: var(--band); position: relative; z-index: 1; }
.sp-mark {
  flex: none; width: min(24px, calc(var(--t) * .58)); aspect-ratio: 1; border-radius: 50%;
  border: 1.5px solid var(--accent); color: var(--accent); position: relative; z-index: 1;
  display: grid; place-items: center; font-family: var(--serif); font-size: min(14px, calc(var(--t) * .34)); line-height: 1;
}
.front {
  width: var(--w); height: var(--h); margin: calc(var(--h) / -2) 0 0 calc(var(--w) / -2);
  transform: rotateY(90deg) translateZ(calc(var(--t) / 2));
  background: var(--base) center / cover no-repeat; background-image: var(--cover);
}
.front::before { opacity: .22; }
.front::after { /* hinge groove + gloss */
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background:
    linear-gradient(90deg, rgba(0,0,0,.45), rgba(255,255,255,.18) 1.6%, rgba(0,0,0,.18) 3.2%, transparent 6%),
    linear-gradient(115deg, rgba(255,255,255,.10), transparent 40%, transparent 70%, rgba(0,0,0,.18));
}
.back {
  width: var(--w); height: var(--h); margin: calc(var(--h) / -2) 0 0 calc(var(--w) / -2);
  transform: rotateY(-90deg) translateZ(calc(var(--t) / 2));
  background: var(--base); filter: brightness(.7);
}
.top {
  width: var(--t); height: var(--w); margin: calc(var(--w) / -2) 0 0 calc(var(--t) / -2);
  transform: rotateX(90deg) translateZ(calc(var(--h) / 2));
  background: repeating-linear-gradient(90deg, #d9d2c0 0 1px, #efe9da 1px 3px); filter: brightness(.82);
}
.edge {
  width: var(--t); height: var(--h); margin: calc(var(--h) / -2) 0 0 calc(var(--t) / -2);
  transform: rotateY(180deg) translateZ(calc(var(--w) / 2));
  background: repeating-linear-gradient(90deg, #d9d2c0 0 1px, #efe9da 1px 3px);
}

.caption {
  flex: none; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 32px; align-items: end;
  padding: 0 16px 22px; border-top: 1px solid var(--line); padding-top: 16px; min-height: 112px;
}
.caption .meta { color: var(--dim); display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
.status { display: inline-flex; border: 1px solid var(--faint); border-radius: 999px; padding: 2px; gap: 2px; background: rgba(0,0,0,.25); }
.status button { font-family: var(--mono); font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; padding: 5px 11px; border-radius: 999px; color: var(--dim); transition: background .2s, color .2s; }
.status button:hover { color: var(--fg); }
.status button[aria-checked="true"] { background: var(--fg); color: var(--bg); }
.status button[data-status="reading"][aria-checked="true"] { background: var(--ribbon); color: #fff4ea; }
.status button[data-status="read"][aria-checked="true"] { background: var(--brass); color: #20180b; }
.caption .thesis { font-size: 17px; line-height: 1.4; max-width: 74ch; margin-top: 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.caption .hint { color: var(--dim); text-align: right; }
.caption .hint .btn { display: block; margin-top: 8px; font-size: 12px; color: var(--fg); }

/* ------------------------------------------------------------------ catalogue */
#catalogue {
  position: fixed; inset: 44px 0 0 0; z-index: 15; background: var(--bg); overflow: auto;
  opacity: 0; pointer-events: none; transition: opacity .35s var(--ease); padding: 24px 16px 60px;
}
#catalogue.show { opacity: 1; pointer-events: auto; }
.cat-row {
  display: grid; grid-template-columns: 44px minmax(0, 2.2fr) minmax(0, 1.2fr) 90px 90px; gap: 16px; align-items: baseline;
  width: 100%; text-align: left; padding: 14px 0; border-bottom: 1px solid var(--line);
}
.cat-row:hover .cat-title { font-style: italic; }
.cat-row.st-read .cat-title { color: var(--brass); }
.cat-row .st { color: var(--dim); }
.cat-row.st-read .st { color: var(--brass); }
.cat-row.st-reading .st { color: var(--ribbon); }
.cat-row .cat-title { font-family: var(--serif); font-size: 30px; line-height: 1.05; }
.cat-row .mono, .cat-head { color: var(--dim); }
.cat-row .sw { width: 22px; height: 30px; display: inline-block; background: var(--base); vertical-align: middle; box-shadow: inset 3px 0 0 rgba(0,0,0,.3), 0 0 0 1px var(--faint); }
.cat-head { padding-bottom: 8px; border-bottom: 1px solid var(--faint); }
.cat-head > span:nth-child(n+4), .cat-row > span:nth-child(n+4) { text-align: right; }

/* ------------------------------------------------------------------ book view */
#view {
  position: fixed; inset: 0; z-index: 30; overflow-y: auto; overflow-x: hidden;
  background-color: rgba(var(--bg-rgb), 0); visibility: hidden; transition: background .35s var(--ease), visibility 0s .35s;
}
#view.show { visibility: visible; transition: background .35s var(--ease); }
#view.in { background-color: rgba(var(--bg-rgb), 1); background-image: radial-gradient(700px 520px at 30% 52%, rgba(var(--lamp), .11), transparent 70%), radial-gradient(120% 80% at 50% 120%, rgba(0,0,0,.6), transparent 60%); }
#view .status { margin-top: 18px; }
.vbar { position: sticky; top: 0; z-index: 3; height: 44px; display: flex; align-items: center; gap: 18px; padding: 0 16px; border-bottom: 1px solid transparent; transition: background .4s, border-color .4s; }
#view.in .vbar { background: rgba(var(--bg-rgb), .85); backdrop-filter: blur(8px); border-color: var(--line); }
.vbar .vt { flex: 1; text-align: center; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.vbar .btn, .vbar .vt { opacity: 0; transition: opacity .3s var(--ease) .1s; }
#view.in .vbar .btn { opacity: .85; }
#view.in .vbar .vt { opacity: 1; }

.page { min-height: calc(100vh - 44px); display: grid; grid-template-columns: auto minmax(0, 560px); gap: 64px; align-items: center; justify-content: center; padding: 28px 40px 44px; }
.stage { display: flex; justify-content: center; }
.leaf-right .ls { font-family: var(--serif); font-style: italic; font-size: calc(var(--hw) * .055); line-height: 1.2; opacity: .75; margin-bottom: 12px; }
.spread { --hw: 300px; --hh: 450px; position: relative; width: calc(var(--hw) * 2); height: var(--hh); perspective: 2600px; transform-origin: 50% 0; will-change: transform; }
.leaf-right {
  position: absolute; left: 50%; top: 0; width: var(--hw); height: 100%;
  background: var(--paper); color: var(--paper-ink);
  box-shadow: 1px 1px 0 #d2cab6, 2px 2px 0 #e4ddca, 3px 3px 0 #cfc7b3, 4px 4px 0 #e1d9c6, 5px 5px 0 #c9c0ab, 6px 7px 18px rgba(0,0,0,.55);
  padding: 10% 11%; display: flex; flex-direction: column; overflow: hidden;
}
.leaf-right::before { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(0,0,0,.28), rgba(0,0,0,.06) 7%, transparent 18%); pointer-events: none; }
.leaf-right .lk { font-family: var(--mono); font-size: 9px; letter-spacing: .12em; text-transform: uppercase; opacity: .6; }
.leaf-right .lt { font-family: var(--serif); font-size: calc(var(--hw) * .115); line-height: 1.02; margin: auto 0 10px; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
.leaf-right .la { font-family: var(--text); font-style: italic; font-size: calc(var(--hw) * .05); opacity: .8; }
.leaf-right .lr { height: 1px; background: currentColor; opacity: .3; margin: 18% 0 10px; }
.leaf-right .lf { font-family: var(--mono); font-size: 9px; letter-spacing: .08em; text-transform: uppercase; opacity: .6; display: flex; justify-content: space-between; }

.cover {
  position: absolute; left: 50%; top: 0; width: var(--hw); height: 100%;
  transform-origin: 0 50%; transform-style: preserve-3d; transform: rotateY(0deg);
  transition: transform .7s cubic-bezier(.5, 0, .2, 1);
}
#view.opened .cover { transform: rotateY(-176deg); }
.cv { position: absolute; inset: 0; backface-visibility: hidden; }
.cv-front { background: var(--base) center / cover no-repeat; background-image: var(--cover); box-shadow: 6px 8px 24px rgba(0,0,0,.6); }
.cv-front::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(0,0,0,.45), rgba(255,255,255,.2) 1.4%, rgba(0,0,0,.2) 2.8%, transparent 5%), linear-gradient(115deg, rgba(255,255,255,.12), transparent 45%); }
.cv-back {
  transform: rotateY(180deg); background-color: var(--base);
  background-image: radial-gradient(circle at 50% 50%, var(--accent) 0 1.2px, transparent 1.6px), linear-gradient(270deg, rgba(0,0,0,.4), transparent 10%);
  background-size: 14px 14px, 100% 100%;
  display: grid; place-items: center;
}
.plate { background: var(--paper); color: var(--paper-ink); padding: 16px 20px; text-align: center; width: 62%; box-shadow: 0 2px 8px rgba(0,0,0,.35); }
.plate .mono { font-size: 9px; opacity: .6; }
.plate .pn { font-family: var(--serif); font-size: calc(var(--hw) * .12); line-height: 1; margin: 6px 0; font-style: italic; }

.info > * { opacity: 0; transform: translateY(10px); transition: opacity .4s var(--ease), transform .4s var(--ease); transition-delay: calc(var(--d, 0) * 45ms + 150ms); }
#view.opened .info > * { opacity: 1; transform: none; }
.kicker { color: var(--dim); }
.info h1 { font-family: var(--serif); font-weight: 400; font-size: clamp(38px, 4vw, 60px); line-height: .98; margin: 10px 0 6px; letter-spacing: -.01em; }
.info .sub { font-family: var(--serif); font-style: italic; font-size: 22px; line-height: 1.2; color: #bdb8ad; margin-bottom: 8px; }
.info .by { font-style: italic; font-size: 19px; color: #cfcac0; }
.info .thesis { font-size: 18px; line-height: 1.5; margin: 18px 0 0; color: #e6e1d6; }
.lab { color: var(--dim); margin: 20px 0 6px; }
.good { list-style: none; margin: 0; padding: 0; }
.good li { position: relative; font-size: 16px; line-height: 1.45; padding: 7px 0 7px 22px; border-top: 1px solid var(--line); color: #d6d1c6; }
.good li::before { content: "→"; position: absolute; left: 0; top: 10px; font-family: var(--mono); font-size: 12px; color: var(--dim); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-family: var(--mono); font-size: 11.5px; padding: 5px 9px; border: 1px solid var(--faint); border-radius: 999px; color: #d6d1c6; }
.rel { display: flex; flex-wrap: wrap; gap: 10px 22px; }
.rel button { display: flex; gap: 10px; align-items: center; text-align: left; }
.rel img { width: 34px; aspect-ratio: 2/3; object-fit: cover; box-shadow: 2px 3px 8px rgba(0,0,0,.6); background: var(--faint); }
.rel .rt { font-family: var(--serif); font-size: 18px; line-height: 1.05; max-width: 16ch; }
.rel button:hover .rt { font-style: italic; }
.note { color: var(--dim); margin-top: 22px; font-size: 10px; line-height: 1.6; }

#toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); opacity: 0; z-index: 50; background: var(--fg); color: var(--bg); padding: 8px 14px; transition: .3s var(--ease); pointer-events: none; }
#toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (max-width: 900px) {
  .page { grid-template-columns: 1fr; padding: 24px 16px 40px; gap: 28px; align-items: start; }
  .caption { grid-template-columns: 1fr; min-height: 0; }
  .caption .hint { text-align: left; }
  .cat-row { grid-template-columns: 28px minmax(0, 1fr) 70px; }
  .cat-row > span:nth-child(3), .cat-row > span:nth-child(5), .cat-head > span:nth-child(3), .cat-head > span:nth-child(5) { display: none; }
  .cat-row .cat-title { font-size: 24px; }
  .bar .count { display: none; }
  .bar { gap: 12px; }
  .bar .brand { font-size: 12px; }
  .leaf-right .lf { flex-direction: column; gap: 2px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: .01ms !important; transition-delay: 0s !important; }
}
</style>
</head>
<body>
<header class="bar">
  <span class="brand">BOOKSHELF</span>
  <button class="btn" id="catBtn">[ Catalogue ]</button>
  <span class="spacer"></span>
  <button class="btn" id="sortBtn">[ Sort: title ]</button>
  <span class="mono count" id="count"></span>
</header>

<main id="shelfPage">
  <div class="lamp" aria-hidden="true"></div>
  <div class="titles-wrap" aria-hidden="true"><div class="titles" id="titles"></div></div>
  <div class="shelf" id="shelf"><div class="row" id="row" role="list"></div></div>
  <div class="caption" id="caption"></div>
</main>

<section id="catalogue" aria-label="Full catalogue"></section>
<section id="view" aria-live="polite"></section>
<div id="toast" class="mono"></div>

<script>
const DATA = /*__LIBRARY__*/null;
const BOOKS = DATA.books;
const BY_ID = Object.fromEntries(BOOKS.map((b, i) => [b.id, b]));
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const LANG = { eng: "English", por: "Portuguese", spa: "Spanish", fra: "French", deu: "German", ita: "Italian" };
const lang = c => LANG[c] || (c || "?").toUpperCase();
const kfmt = n => n >= 1e6 ? (n / 1e6).toFixed(1) + "M" : n >= 1000 ? Math.round(n / 1000) + "k" : String(n);
const hours = w => Math.max(1, Math.round(w / 250 / 60));
const authors = b => b.authors.join(", ");
const splitTitle = t => { const k = t.indexOf(": "); return k > 0 ? [t.slice(0, k), t.slice(k + 2)] : [t, ""]; };
const nchap = b => b.chapters;
const surname = b => (b.authors[0] || "").split(/[ ,]+/).filter(Boolean).slice(b.authors[0]?.includes(",") ? 0 : -1)[0] || "";

function hash(s) { let h = 2166136261; for (const c of s) h = Math.imul(h ^ c.charCodeAt(0), 16777619); return (h >>> 0) / 4294967296; }
function rgb(hex) { const n = parseInt(hex.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function lum(hex) { const [r, g, b] = rgb(hex).map(v => { v /= 255; return v <= .03928 ? v / 12.92 : ((v + .055) / 1.055) ** 2.4; }); return .2126 * r + .7152 * g + .0722 * b; }
function contrast(a, b) { const [x, y] = [lum(a), lum(b)].sort((p, q) => q - p); return (x + .05) / (y + .05); }
function hue(hex) {
  const [r, g, b] = rgb(hex).map(v => v / 255), mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn;
  if (d < .08) return 400 + (1 - mx) * 100; // greys last, light to dark
  const h = mx === r ? ((g - b) / d) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
  return (h * 60 + 360) % 360;
}

// Colours and sizes for each book, from the cover (picked in Python) and the word count.
const WMIN = Math.log(Math.min(...BOOKS.map(b => b.words))), WMAX = Math.log(Math.max(...BOOKS.map(b => b.words)));
BOOKS.forEach((b, i) => {
  const base = b.cover?.base || "#5a5048";
  const ink = lum(base) > .4 ? "#16140f" : "#f4efe4";
  let accent = b.cover?.accent;
  const real = accent && contrast(accent, base) >= 2.2;
  if (!real) accent = ink;
  b.ui = {
    n: i + 1, base, ink, accent, band: real ? accent : "rgba(0,0,0,.3)",
    accent2: b.cover?.accent && contrast(b.cover.accent, "#0a0a0a") > 3 ? b.cover.accent : null,
    aspect: b.cover ? b.cover.h / b.cover.w : 1.5,
    thick: (WMAX > WMIN ? (Math.log(b.words) - WMIN) / (WMAX - WMIN) : .5),
    tall: .86 + .14 * hash(b.id), variant: Math.floor(hash(b.id + "v") * 3),
  };
});

// ------------------------------------------------------------------ reading status
// Saved to reading.json through `books site --serve`; opened from disk, kept in this browser only.
const STATUSES = ["unread", "reading", "read"];
let READ = DATA.reading || {}, SAVES_TO_FILE = false, warned = false;
const statusOf = id => READ[id]?.status || "unread";

function statusToggle(b) {
  const st = statusOf(b.id);
  return `<div class="status" role="radiogroup" aria-label="Reading status" data-id="${esc(b.id)}">${STATUSES.map(x =>
    `<button role="radio" data-status="${x}" aria-checked="${x === st}">${x}</button>`).join("")}</div>`;
}

async function loadReading() {
  if (location.protocol.startsWith("http")) {
    try {
      const r = await fetch("api/reading", { cache: "no-store" });
      if (r.ok) { READ = await r.json(); SAVES_TO_FILE = true; }
    } catch (e) {}
  }
  if (!SAVES_TO_FILE) {
    try { const l = JSON.parse(localStorage.getItem("shelf.reading") || "null"); if (l) READ = l; } catch (e) {}
  }
  applyReading();
}

async function setStatus(id, st) {
  const before = READ;
  READ = { ...READ };
  if (st === "unread") delete READ[id]; else READ[id] = { status: st, since: new Date().toISOString().slice(0, 10) };
  applyReading();
  if (SAVES_TO_FILE) {
    try {
      const r = await fetch("api/reading", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id, status: st }) });
      if (!r.ok) throw new Error((await r.json()).error);
      READ = await r.json(); applyReading();
    } catch (e) { READ = before; applyReading(); toast("Not saved: " + e.message); }
  } else {
    try { localStorage.setItem("shelf.reading", JSON.stringify(READ)); } catch (e) {}
    if (!warned) { warned = true; toast("Saved in this browser only. Run `books site --serve` to save to reading.json"); }
  }
}

function applyReading() {
  row.querySelectorAll(".slot").forEach(el => {
    const st = statusOf(BOOKS[+el.dataset.i].id);
    el.classList.toggle("reading", st === "reading"); el.classList.toggle("read", st === "read");
  });
  titles.querySelectorAll(".tt").forEach(t => {
    const b = BOOKS[+t.dataset.i], st = statusOf(b.id);
    t.classList.toggle("st-read", st === "read"); t.classList.toggle("st-reading", st === "reading");
    t.querySelector("sup").textContent = `(${st === "unread" ? b.language : st})`;
  });
  document.querySelectorAll(".status[data-id]").forEach(g => {
    const st = statusOf(g.dataset.id);
    g.querySelectorAll("button").forEach(btn => btn.setAttribute("aria-checked", btn.dataset.status === st));
  });
  const n = st => BOOKS.filter(b => statusOf(b.id) === st).length;
  $("#count").innerHTML = `[ ${BOOKS.length} books · <b>${n("read")} read</b> · <i>${n("reading")} reading</i> ]`;
  if (cat.classList.contains("show")) renderCatalogue();
}

document.addEventListener("click", e => {
  const btn = e.target.closest(".status [data-status]"); if (!btn) return;
  e.stopPropagation();
  const id = btn.closest(".status").dataset.id;
  if (statusOf(id) !== btn.dataset.status) setStatus(id, btn.dataset.status);
}, true);

// ------------------------------------------------------------------ shelf
const shelf = $("#shelf"), row = $("#row"), titles = $("#titles");
let order = BOOKS.map((_, i) => i);
let active = 0;
const SORTS = {
  title: (a, b) => a.title.localeCompare(b.title),
  author: (a, b) => surname(a).localeCompare(surname(b)) || a.title.localeCompare(b.title),
  length: (a, b) => b.words - a.words,
  colour: (a, b) => hue(a.ui.base) - hue(b.ui.base),
};
const sortNames = Object.keys(SORTS);
let sortName = "title";
try { sortName = localStorage.getItem("shelf.sort") || "title"; } catch (e) {}
if (!SORTS[sortName]) sortName = "title";

function sizes() {
  const sh = Math.round(Math.min(520, Math.max(270, innerHeight * .5)));
  document.documentElement.style.setProperty("--shelf-h", sh + "px");
  row.querySelectorAll(".slot").forEach(el => {
    const b = BOOKS[+el.dataset.i], u = b.ui;
    const h = Math.round(sh * u.tall), w = Math.round(h / u.aspect), t = Math.round((24 + 58 * u.thick) * sh / 480);
    el.style.setProperty("--h", h + "px"); el.style.setProperty("--w", w + "px"); el.style.setProperty("--t", t + "px");
  });
}

function renderShelf() {
  order = BOOKS.map((_, i) => i).sort((x, y) => SORTS[sortName](BOOKS[x], BOOKS[y]));
  row.innerHTML = order.map(i => {
    const b = BOOKS[i], u = b.ui;
    return `<div class="slot v${u.variant}" role="listitem" data-i="${i}" style="--base:${u.base};--ink:${u.ink};--accent:${u.accent};--band:${u.band};${b.cover ? `--cover:url('${b.cover.src}')` : ""}">
      <button class="book" aria-label="${esc(b.title)} by ${esc(authors(b))}">
        <div class="box">
          <div class="face spine"><span class="sp-band"></span><span class="sp-author">${esc(surname(b) || authors(b))}</span><span class="sp-title">${esc(b.title.split(":")[0])}</span><span class="sp-mark">${esc(b.title.replace(/^(the|a|o|as|os)\s+/i, "")[0] || "·")}</span></div>
          <div class="face front"></div><div class="face back"></div><div class="face top"></div><div class="face edge"></div><div class="ribbon"></div>
        </div>
      </button></div>`;
  }).join("");
  titles.innerHTML = order.map(i => `<span class="tt" data-i="${i}">${esc(BOOKS[i].title.split(":")[0])}<sup>(${esc(BOOKS[i].language)})</sup></span>`).join("");
  $("#sortBtn").textContent = `[ ${sortName} ]`;
  sizes();
  applyReading();
  setActive(active, { instant: true, center: true });
}

const slotOf = i => row.querySelector(`.slot[data-i="${i}"]`);
let anchorUntil = 0;
function setActive(i, { instant = false, center = false, anchor = false } = {}) {
  const prev = active; active = i;
  row.querySelectorAll(".slot.active").forEach(el => el.classList.remove("active"));
  const el = slotOf(i); if (!el) return;
  // Keep the hovered book under the pointer while its neighbours slide apart. Hold its centre,
  // not its slot's left edge: the slot widens around the book, so the left edge would let the
  // book drift right by half the widening.
  const mid = r => r.left + r.width / 2;
  const x0 = mid(el.getBoundingClientRect());
  el.classList.add("active");
  titles.querySelectorAll(".tt").forEach(t => t.classList.toggle("on", +t.dataset.i === i));
  renderCaption();
  if (anchor && prev !== i) {
    anchorUntil = performance.now() + 450;
    const keep = () => { shelf.scrollLeft += mid(el.getBoundingClientRect()) - x0; if (performance.now() < anchorUntil) requestAnimationFrame(keep); };
    requestAnimationFrame(keep);
  } else if (center) {
    const go = () => {
      const r = el.getBoundingClientRect(), target = shelf.scrollLeft + r.left + r.width / 2 - innerWidth / 2;
      shelf.scrollTo({ left: target, behavior: instant ? "auto" : "smooth" });
    };
    if (instant) { row.classList.add("still"); go(); requestAnimationFrame(() => requestAnimationFrame(() => row.classList.remove("still"))); }
    else setTimeout(go, 60);
  }
  frame();
}

function renderCaption() {
  const b = BOOKS[active];
  $("#caption").innerHTML = `<div><div class="mono meta"><span>${esc(authors(b))} &nbsp;·&nbsp; ${nchap(b)} chapters &nbsp;·&nbsp; ${kfmt(b.words)} words &nbsp;·&nbsp; ${lang(b.language)}</span>${statusToggle(b)}</div>
    <div class="thesis">${esc(b.thesis)}</div></div>
    <div class="mono hint">Scroll or ← → to browse<button class="btn" id="openBtn">[ Open the book → ]</button></div>`;
  $("#openBtn").onclick = () => go(b.id);
}

// Per-frame: perspective seen from the middle of the screen, titles following the active book.
// Speed matters here (measured: this was the lag). Read every position first, then write; set
// perspective-origin and the lamp's position directly. Never set a CSS variable on a slot or on a
// container of the shelf: every face of every book inherits it and gets restyled each frame.
let raf = 0;
const lampEl = $(".lamp"), lastPx = new WeakMap();
function frame() {
  if (raf) return;
  raf = requestAnimationFrame(() => {
    raf = 0;
    const mid = innerWidth / 2, slots = row.children, rects = [];
    for (const el of slots) rects.push(el.getBoundingClientRect());
    for (let n = 0; n < slots.length; n++) {
      const r = rects[n];
      if (r.right < -200 || r.left > innerWidth + 200) continue;
      const px = Math.round((mid - (r.left + r.width / 2)) * .3);
      if (lastPx.get(slots[n]) !== px) { lastPx.set(slots[n], px); slots[n].style.perspectiveOrigin = `calc(50% + ${px}px) 12%`; }
    }
    const el = slotOf(active), t = titles.querySelector(`.tt[data-i="${active}"]`);
    if (!el) return;
    const r = el.getBoundingClientRect(), cx = r.left + r.width / 2;
    lampEl.style.left = Math.round(cx - 450) + "px";
    if (t) {
      const want = cx - (t.offsetLeft + t.offsetWidth / 2);
      const min = Math.min(0, innerWidth - titles.scrollWidth - 40);
      titles.style.transform = `translateX(${Math.max(min - 40, Math.min(40, want))}px)`;
    }
  });
}

// Edge scrolling: with the mouse near the left or right edge of the shelf, the shelf glides that
// way by itself (faster the closer to the edge), so the far books are reachable without the wheel.
let edgeSpeed = 0, edgeRaf = 0;
function edgeStep() {
  edgeRaf = 0;
  if (!edgeSpeed || current || drag) return;
  const before = shelf.scrollLeft;
  shelf.scrollLeft += edgeSpeed;
  if (shelf.scrollLeft === before) return;      // reached the end
  anchorUntil = 0;                               // don't pin the hovered book while gliding
  lastScrollInput = performance.now();
  edgeRaf = requestAnimationFrame(edgeStep);
}
shelf.addEventListener("pointermove", e => {
  if (e.pointerType !== "mouse") return;
  const zone = Math.max(110, innerWidth * .16);
  const d = e.clientX < zone ? -(zone - e.clientX) : e.clientX > innerWidth - zone ? e.clientX - (innerWidth - zone) : 0;
  edgeSpeed = d ? Math.sign(d) * Math.round(2 + 16 * (Math.abs(d) / zone) ** 2) : 0;
  if (edgeSpeed && !edgeRaf) edgeRaf = requestAnimationFrame(edgeStep);
});
shelf.addEventListener("pointerleave", () => { edgeSpeed = 0; });
shelf.addEventListener("scroll", frame, { passive: true });
addEventListener("resize", () => { sizes(); frame(); });

shelf.addEventListener("wheel", e => {
  lastScrollInput = performance.now(); anchorUntil = 0; // the user scrolls: stop pinning the hovered book
  const d = Math.abs(e.deltaY) > Math.abs(e.deltaX) ? e.deltaY : e.deltaX;
  shelf.scrollLeft += e.deltaMode === 1 ? d * 40 : d;
  e.preventDefault();
}, { passive: false });

// Drag to scroll (mouse); a drag never counts as a click.
let drag = null, dragged = false;
shelf.addEventListener("pointerdown", e => { if (e.pointerType !== "mouse" || e.button) return; drag = { x: e.clientX, s: shelf.scrollLeft }; dragged = false; });
addEventListener("pointermove", e => {
  if (!drag) return;
  const dx = e.clientX - drag.x;
  if (Math.abs(dx) > 5) { dragged = true; shelf.classList.add("dragging"); }
  if (dragged) { shelf.scrollLeft = drag.s - dx; lastScrollInput = performance.now(); anchorUntil = 0; }
});
addEventListener("pointerup", () => { drag = null; shelf.classList.remove("dragging"); });

// Hover selects a book only when the mouse itself moves. While the shelf scrolls, books slide
// under a still pointer: those must not count, or selection and scrolling fight each other.
let lastScrollInput = 0;
row.addEventListener("pointermove", e => {
  if (e.pointerType !== "mouse" || drag || (!e.movementX && !e.movementY)) return;
  if (performance.now() - lastScrollInput < 250 || performance.now() < anchorUntil) return;
  const el = e.target.closest(".slot"); if (!el) return;
  const i = +el.dataset.i;
  if (i !== active) setActive(i, { anchor: true });
});
row.addEventListener("click", e => {
  const el = e.target.closest(".slot"); if (!el || dragged) return;
  const i = +el.dataset.i;
  if (i !== active) setActive(i, { center: true }); // first tap on touch: pull the book out
  else go(BOOKS[i].id);
});
titles.parentElement.addEventListener("click", e => {
  const t = e.target.closest(".tt"); if (t) setActive(+t.dataset.i, { center: true });
});
titles.parentElement.removeAttribute("aria-hidden");

$("#sortBtn").onclick = () => {
  sortName = sortNames[(sortNames.indexOf(sortName) + 1) % sortNames.length];
  try { localStorage.setItem("shelf.sort", sortName); } catch (e) {}
  renderShelf();
};

// ------------------------------------------------------------------ catalogue
const cat = $("#catalogue");
function renderCatalogue() {
  const list = [...order].map(i => BOOKS[i]);
  cat.innerHTML = `<div class="cat-row cat-head mono"><span></span><span>Title</span><span>Author</span><span>Words</span><span>Status</span></div>` +
    list.map(b => `<button class="cat-row st-${statusOf(b.id)}" data-id="${esc(b.id)}" style="--base:${b.ui.base}">
      <span><i class="sw"></i></span><span class="cat-title">${esc(b.title)}</span><span class="mono">${esc(authors(b))}</span>
      <span class="mono">${kfmt(b.words)}</span><span class="mono st">${statusOf(b.id) === "unread" ? "—" : statusOf(b.id)}</span></button>`).join("");
}
$("#catBtn").onclick = () => {
  const show = !cat.classList.contains("show");
  if (show) renderCatalogue();
  cat.classList.toggle("show", show);
  $("#catBtn").textContent = show ? "[ Shelf ]" : "[ Catalogue ]";
};
cat.addEventListener("click", e => { const r = e.target.closest("[data-id]"); if (r) go(r.dataset.id); });

// ------------------------------------------------------------------ book view
const view = $("#view");
let current = null, timers = [];
const later = (fn, ms) => timers.push(setTimeout(fn, ms));
const clearTimers = () => { timers.forEach(clearTimeout); timers = []; };

function go(id) { location.hash = "#/book/" + encodeURIComponent(id); }

function heroSize(b) {
  const narrow = innerWidth < 900;
  let hh = Math.min(440, innerHeight * (narrow ? .42 : .58));
  let hw = hh / b.ui.aspect;
  const avail = narrow ? innerWidth - 32 : Math.min(640, innerWidth * .45);
  if (hw * 2 > avail) { hw = avail / 2; hh = hw * b.ui.aspect; }
  return { hw: Math.round(hw), hh: Math.round(hh) };
}

// One page per book: who wrote it, the thesis, what it's good for, its topics, its neighbours.
function renderView(b) {
  const u = b.ui, { hw, hh } = heroSize(b);
  const idx = order.indexOf(BOOKS.indexOf(b));
  const [main, sub] = splitTitle(b.title);
  const related = (b.related || []).filter(r => BY_ID[r.id]).slice(0, 3);
  const facts = [lang(b.language), b.pubdate, `${nchap(b)} chapters`, `~${hours(b.words)}h read`].filter(Boolean).join(" · ");
  view.style.cssText = `--base:${u.base};--accent:${u.accent};${b.cover ? `--cover:url('${b.cover.src}')` : ""}`;
  view.innerHTML = `
  <header class="vbar">
    <button class="btn" id="back">[ ← Shelf ]</button>
    <span class="mono vt">${esc(main)}</span>
    <button class="btn" id="prev" aria-label="Previous book">[ ‹ ]</button>
    <button class="btn" id="next" aria-label="Next book">[ › ]</button>
  </header>
  <section class="page">
    <div class="stage"><div class="spread" style="--hw:${hw}px;--hh:${hh}px">
      <div class="leaf-right">
        <div class="lk">Bookshelf · ${lang(b.language)}</div>
        <div class="lt">${esc(main)}</div>${sub ? `<div class="ls">${esc(sub)}</div>` : ""}
        <div class="la">${esc(authors(b))}</div>
        <div class="lr"></div>
        <div class="lf"><span>${nchap(b)} chapters</span><span>${kfmt(b.words)} words</span></div>
      </div>
      <div class="cover"><div class="cv cv-front"></div>
        <div class="cv cv-back"><div class="plate"><div class="mono">Ex libris</div><div class="pn">No. ${String(idx + 1).padStart(2, "0")}</div><div class="mono">of ${BOOKS.length}</div></div></div></div>
    </div></div>
    <div class="info">
      <div class="mono kicker" style="--d:0">${esc(facts)}</div>
      <h1 style="--d:1">${esc(main)}</h1>
      ${sub ? `<div class="sub" style="--d:1">${esc(sub)}</div>` : ""}
      <div class="by" style="--d:2">${esc(authors(b))}</div>
      <div style="--d:2">${statusToggle(b)}</div>
      ${b.thesis ? `<p class="thesis" style="--d:3">${esc(b.thesis)}</p>` : ""}
      ${b.use_for.length ? `<div class="mono lab" style="--d:4">Good for</div>
      <ul class="good" style="--d:4">${b.use_for.slice(0, 3).map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}
      ${b.concepts.length ? `<div class="mono lab" style="--d:5">Topics</div>
      <div class="chips" style="--d:5">${b.concepts.slice(0, 8).map(c => `<span class="chip">${esc(c)}</span>`).join("")}</div>` : ""}
      ${related.length ? `<div class="mono lab" style="--d:6">Shares ideas with</div>
      <div class="rel" style="--d:6">${related.map(r => {
        const o = BY_ID[r.id];
        return `<button data-go="${esc(o.id)}" title="Shared: ${esc(r.concepts.join(", "))}">${o.cover ? `<img src="${esc(o.cover.src)}" alt="">` : ""}<span class="rt">${esc(splitTitle(o.title)[0])}</span></button>`;
      }).join("")}</div>` : ""}
      <div class="mono note" style="--d:7">Summaries written by Claude Haiku from the book's text · <button class="btn" data-copy="uv run books book ${esc(b.id)}">copy CLI command</button></div>
    </div>
  </section>`;
  $("#back", view).onclick = () => { location.hash = ""; };
  $("#prev", view).onclick = () => step(-1);
  $("#next", view).onclick = () => step(1);
}

function step(d) {
  const k = order.indexOf(BOOKS.indexOf(current));
  go(BOOKS[order[(k + d + order.length) % order.length]].id);
}

view.addEventListener("click", e => {
  const c = e.target.closest("[data-copy]");
  if (c) { navigator.clipboard?.writeText(c.dataset.copy).then(() => toast("Copied: " + c.dataset.copy), () => toast(c.dataset.copy)); return; }
  const g = e.target.closest("[data-go]");
  if (g) go(g.dataset.go);
});

function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 1800);
}

// Fly the shelf book's cover to where the open book sits, then open it.
function flight(spread, fromRect) {
  const to = $(".cover", spread).getBoundingClientRect();
  const s = fromRect.height / to.height;
  return `translate(${fromRect.left - to.left}px, ${fromRect.top - to.top}px) scale(${s})`;
}

function openBook(b) {
  clearTimers();
  const switching = current && view.classList.contains("show");
  const i = BOOKS.indexOf(b);
  if (!switching && active !== i) setActive(i, { instant: true, center: true });
  current = b;
  document.title = b.title + " · Bookshelf";
  cat.classList.remove("show"); $("#catBtn").textContent = "[ Catalogue ]";

  if (switching) { // turning to another book from inside the view
    view.classList.remove("opened");
    later(() => { renderView(b); view.scrollTop = 0; requestAnimationFrame(() => requestAnimationFrame(() => view.classList.add("opened"))); }, 220);
    return;
  }
  renderView(b);
  view.scrollTop = 0;
  view.classList.add("show");
  document.body.classList.add("reading");
  const slot = slotOf(i), face = slot && $(".front", slot), spread = $(".spread", view);
  const from = face && face.getBoundingClientRect();
  if (from && from.width > 20 && from.right > 0 && from.left < innerWidth) {
    spread.style.transition = "none";
    spread.style.transform = flight(spread, from);
    slot.classList.add("flying");
    spread.getBoundingClientRect();
    requestAnimationFrame(() => {
      view.classList.add("in");
      spread.style.transition = "transform .5s cubic-bezier(.6,0,.2,1)";
      spread.style.transform = "none";
    });
    later(() => view.classList.add("opened"), 420);
  } else {
    view.classList.add("in");
    later(() => view.classList.add("opened"), 120);
  }
}

function closeBook() {
  if (!current) return;
  clearTimers();
  const b = current; current = null;
  document.title = "Bookshelf";
  const i = BOOKS.indexOf(b), slot = slotOf(i), spread = $(".spread", view);
  if (active !== i) setActive(i, { instant: true, center: true });
  const finish = () => {
    view.classList.remove("show", "in", "opened");
    row.querySelectorAll(".flying").forEach(el => el.classList.remove("flying"));
    view.innerHTML = "";
  };
  document.body.classList.remove("reading");
  if (view.scrollTop > 120 || !slot) { view.classList.remove("in", "opened"); later(finish, 350); return; }
  view.classList.remove("opened");
  slot.classList.add("flying");
  later(() => {
    const from = $(".front", slot).getBoundingClientRect();
    spread.style.transition = "transform .45s cubic-bezier(.6,0,.2,1)";
    spread.style.transform = flight(spread, from);
    view.classList.remove("in");
    later(finish, 450);
  }, 380);
}

function route() {
  const m = location.hash.match(/^#\/book\/(.+)$/);
  const b = m && BY_ID[decodeURIComponent(m[1])];
  if (b) { if (b !== current) openBook(b); }
  else closeBook();
}
addEventListener("hashchange", route);

addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (current) {
    if (e.key === "Escape") location.hash = "";
    else if (e.key === "ArrowLeft") step(-1);
    else if (e.key === "ArrowRight") step(1);
    return;
  }
  if (cat.classList.contains("show")) { if (e.key === "Escape") $("#catBtn").click(); return; }
  const k = order.indexOf(active);
  if (e.key === "ArrowRight" || e.key === "ArrowLeft") {
    const j = order[Math.max(0, Math.min(order.length - 1, k + (e.key === "ArrowRight" ? 1 : -1)))];
    setActive(j, { center: true }); e.preventDefault();
  } else if (e.key === "Enter" && !e.target.closest("button")) go(BOOKS[active].id);
});

// ------------------------------------------------------------------ start
$("#count").textContent = `[ ${BOOKS.length} books · ${kfmt(BOOKS.reduce((s, b) => s + b.words, 0))} words ]`;
active = Math.floor(hash(new Date().toDateString()) * BOOKS.length); // a different book out each day
renderShelf();
loadReading();
if (document.fonts) document.fonts.ready.then(frame);
route();
</script>
</body>
