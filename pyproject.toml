[project]
name = "bookshelf"
version = "0.1.0"
description = "Turn a Calibre library into a searchable, agent-friendly knowledge layer."
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "markdownify>=0.13",
    "pymupdf>=2.1",
    "sentence-transformers>=6.3.0",
    "sqlite-vec>=0.1.9",
    "typer>=0.12",
    "torch>=2.15",  # direct so [tool.uv.sources] can point it at the CUDA index
    "anthropic>=2.12.0",
]

[project.scripts]
books = "bookshelf.cli:app"

[tool.uv]
# Hard links from uv's cache fail here with os error 396 (OneDrive cloud files).
link-mode = "copy"

# PyTorch: the CUDA build on Windows and Linux (embeds ~20x faster on an NVIDIA GPU,
# and still runs on CPU without one); the regular build on macOS (no CUDA there).
# No NVIDIA GPU and want a much smaller install? Delete these two blocks and run `uv sync`.
[tool.uv.sources]
torch = [{ index = "pytorch-cu132", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bookshelf"]
